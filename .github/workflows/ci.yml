name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # Repo chưa có lockfile → dùng npm install. Nên tạo và commit package-lock.json
        # để build tái lập được (npm ci).
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

  eas-preview:
    name: EAS Preview (Android)
    # Chỉ chạy trên PR khi EXPO_TOKEN được đặt.
    # Bỏ qua step nếu thiếu token thay vì dùng if ở job level (hạn chế của expression context).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN
        id: check_token
        run: |
          if [ -n "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "has_token=yes" >> $GITHUB_OUTPUT
          else
            echo "has_token=no" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo
        if: steps.check_token.outputs.has_token == 'yes'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.check_token.outputs.has_token == 'yes'
        run: npm install

      - name: EAS Preview build
        if: steps.check_token.outputs.has_token == 'yes'
        run: eas build --profile preview --platform android --non-interactive --no-wait
