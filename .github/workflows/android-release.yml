# GitHub Actions Workflow: Android Release Build & Publish
#
# Trigger: Push a tag matching v*.*.* (e.g. v1.2.3) or run manually.
#
# Required GitHub Secrets:
#   KEYSTORE_BASE64     — Base64-encoded release keystore file
#                         Generate with: base64 -w 0 release.keystore > keystore.b64
#   KEYSTORE_PASSWORD   — Password for the keystore
#   KEY_ALIAS           — Alias of the signing key inside the keystore
#   KEY_PASSWORD        — Password for the signing key
#
# Required build.gradle signing config (android/app/build.gradle):
#   android {
#     signingConfigs {
#       release {
#         storeFile file(MYAPP_RELEASE_STORE_FILE)
#         storePassword MYAPP_RELEASE_STORE_PASSWORD
#         keyAlias MYAPP_RELEASE_KEY_ALIAS
#         keyPassword MYAPP_RELEASE_KEY_PASSWORD
#       }
#     }
#     buildTypes {
#       release {
#         signingConfig signingConfigs.release
#         minifyEnabled true
#         proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
#       }
#     }
#   }

name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build and sign the release APK
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Decode keystore
        # Decode the base64-encoded keystore into a file.
        # The secret value is never echoed to stdout.
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Configure Gradle signing properties
        # Append signing config to gradle.properties so Gradle can pick it up.
        # Values come from secrets and are written directly to the file — never printed.
        run: |
          {
            echo "MYAPP_RELEASE_STORE_FILE=release.keystore"
            echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> android/gradle.properties

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version tag
        run: |
          VERSION=${{ github.ref_name }}
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/app-${VERSION}-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-*-release.apk
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Create GitHub Release and attach the APK
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: app-*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
