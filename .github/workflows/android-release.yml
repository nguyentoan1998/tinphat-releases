name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: self-hosted

    steps:
      - name: Enable Long Paths
        shell: powershell
        run: |
          # Bật Long Paths trong Windows và Git
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Force -ErrorAction SilentlyContinue
          git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Full Build Process on Short Path
        shell: powershell
        env:
          CI: 1
        run: |
          # 1. Tạo thư mục build cực ngắn trên ổ C: để tránh lỗi 260 ký tự
          $shortPath = "C:\b"
          if (Test-Path $shortPath) { 
            echo "Cleaning old build directory..."
            Remove-Item -Recurse -Force $shortPath -ErrorAction SilentlyContinue 
          }
          New-Item -ItemType Directory -Path $shortPath -Force
          
          # 2. Copy code vào thư mục ngắn (dùng robocopy cho nhanh và ổn định)
          echo "Copying code to $shortPath..."
          robocopy . $shortPath /E /NFL /NDL /NJH /NJS /nc /ns /np
          
          # 3. Di chuyển vào thư mục ngắn
          cd $shortPath
          if (Test-Path "mobile") { cd mobile }
          echo "Current Directory: $PWD"

          try {
            # 4. Cài đặt dependencies
            echo "Installing dependencies..."
            npm install

            # 5. Chấp nhận licenses SDK
            $sdkPath = "$env:LOCALAPPDATA\Android\Sdk"
            if (-not (Test-Path $sdkPath)) { $sdkPath = "C:\Users\PC\AppData\Local\Android\Sdk" }
            $licensesPath = "$sdkPath\licenses"
            if (-not (Test-Path $licensesPath)) { New-Item -ItemType Directory -Force -Path $licensesPath | Out-Null }
            Set-Content "$licensesPath\android-sdk-license" "`n24333f8a63b6825ea9c5514f83c2829b004d1fee`n8933bad161af4178b1185d1a37fbf41ea5269c55`nd56f5187479451eabf01fb78af6dfcb131a6481e"
            Set-Content "$licensesPath\android-sdk-preview-license" "`n84831b9409646a918e30573bab4c9c91346d8abd"
            Set-Content "$licensesPath\android-ndk-license" "`n592f34765d104ee6b4b9b44b8aea9fcb3170e17"

            # 6. Expo Prebuild
            echo "Running Expo Prebuild..."
            npx expo prebuild --platform android --non-interactive

            # 7. Cấu hình Signing và Build
            if (-not (Test-Path "android")) { throw "Android directory not found!" }
            cd android
            
            echo "Configuring Signing..."
            $keystoreBytes = [Convert]::FromBase64String("${{ secrets.KEYSTORE_BASE64 }}")
            [IO.File]::WriteAllBytes("app\release.keystore", $keystoreBytes)
            
            Add-Content "gradle.properties" "`nMYAPP_RELEASE_STORE_FILE=release.keystore"
            Add-Content "gradle.properties" "`nMYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            Add-Content "gradle.properties" "`nMYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            Add-Content "gradle.properties" "`nMYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            
            (Get-Content "gradle.properties") -replace 'org.gradle.jvmargs=.*', 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m' | Set-Content "gradle.properties"
            Add-Content "gradle.properties" "`norg.gradle.parallel=false"

            echo "Starting Gradle Build..."
            .\gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a --stacktrace

          } finally {
            # Giữ nguyên để step sau upload
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: C:/b/**/android/app/build/outputs/apk/release/tinphatapp.apk
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: self-hosted

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: tinphatapp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
