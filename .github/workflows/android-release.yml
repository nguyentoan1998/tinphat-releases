name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: self-hosted

    steps:
      - name: Enable Long Paths
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Force -ErrorAction SilentlyContinue

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Shorten Path with SUBST
        shell: powershell
        run: |
          if (Test-Path "Z:") { subst Z: /D }
          subst Z: $PWD
          echo "Workspace mapped to Z:\"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: |
          cd Z:\mobile
          npm install

      - name: Accept Android SDK licenses
        shell: powershell
        run: |
          $sdkPath = "$env:LOCALAPPDATA\Android\Sdk"
          if (-not (Test-Path $sdkPath)) { $sdkPath = "C:\Users\PC\AppData\Local\Android\Sdk" }
          $licensesPath = "$sdkPath\licenses"
          New-Item -ItemType Directory -Force -Path $licensesPath | Out-Null
          Set-Content "$licensesPath\android-sdk-license" "`n24333f8a63b6825ea9c5514f83c2829b004d1fee`n8933bad161af4178b1185d1a37fbf41ea5269c55`nd56f5187479451eabf01fb78af6dfcb131a6481e"
          Set-Content "$licensesPath\android-sdk-preview-license" "`n84831b9409646a918e30573bab4c9c91346d8abd"
          Set-Content "$licensesPath\android-ndk-license" "`n592f34765d104ee6b4b9b44b8aea9fcb3170e17"

      - name: Run Expo prebuild
        shell: powershell
        run: |
          cd Z:\mobile
          npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        shell: powershell
        run: |
          cd Z:\mobile\android
          
          # Cấu hình Gradle Signing ngay tại đây để đảm bảo an toàn
          $keystoreBytes = [Convert]::FromBase64String("${{ secrets.KEYSTORE_BASE64 }}")
          [IO.File]::WriteAllBytes("app\release.keystore", $keystoreBytes)
          
          Add-Content "gradle.properties" "`nMYAPP_RELEASE_STORE_FILE=release.keystore"
          Add-Content "gradle.properties" "`nMYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
          Add-Content "gradle.properties" "`nMYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
          Add-Content "gradle.properties" "`nMYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          
          # Tăng memory và tắt build song song để tránh lỗi Ninja
          (Get-Content "gradle.properties") -replace 'org.gradle.jvmargs=.*', 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m' | Set-Content "gradle.properties"
          Add-Content "gradle.properties" "`norg.gradle.parallel=false"
          
          try {
            .\gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a --stacktrace
          } finally {
            # Giữ nguyên ổ Z cho đến hết job
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: Z:/mobile/android/app/build/outputs/apk/release/tinphatapp.apk
          retention-days: 7

      - name: Cleanup SUBST
        if: always()
        shell: powershell
        run: |
          if (Test-Path "Z:") { subst Z: /D }

  release:
    name: Create GitHub Release
    needs: build
    runs-on: self-hosted

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: tinphatapp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
